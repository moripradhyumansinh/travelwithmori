# The website files are copied into "dist" so that code and settings
# (netlify/, package.json, node_modules) are never published.
[build]
  command = "mkdir -p dist photos data && cp -r index.html photos.json photos admin data dist/"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The admin pages should never be cached or indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
